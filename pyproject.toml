[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psp2-err"
version = "0.1.0"
description = "Offline PS Vita error-code lookup tool"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "psp2_err contributors" }]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
psp2_err = "psp2_err.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"psp2_err.data" = ["errors.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

